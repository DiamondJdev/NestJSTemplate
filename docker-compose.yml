services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5200:5200"
    env_file:
      - .env
    environment:
      # env_file loads the host .env; environment: always wins for the same key,
      # pinning the container to the bundled postgres service and port 5200
      # regardless of what .env points at for native (non-Docker) dev.
      PORT: "5200"
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/template_dev
      DB_SSL: "false"
      DB_SYNC: "true"
    volumes:
      - ./src:/app/src
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d template_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
